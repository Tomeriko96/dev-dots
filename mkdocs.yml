site_name: dev-dots handboek
site_url: https://cedanl.github.io/dev-dots/
site_description: Handleiding voor de dev-dots devcontainer — tools, sneltoetsen en AI-workflows
repo_url: https://github.com/cedanl/dev-dots
repo_name: cedanl/dev-dots
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: nl
  logo: assets/logos/npuls_logo.jpg
  favicon: assets/logos/beeldmerk.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - navigation.top
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.follow
  palette:
    - scheme: default
      primary: custom
      accent: custom

extra_css:
  - stylesheets/extra.css

nav:
  - Welkom: index.md
  - Dagelijks werk:
    - Terminal, tmux & navigatie: navigatie.md
    - Editor: editor.md
    - Git: git.md
    - Shell: shell.md
    - AI-workflows: ai.md
  - Tools en automatisering:
    - Extra tools: tools.md
    - Automatisering: automatisering.md
  - Beveiliging: beveiliging.md

extra:
  generator: false

copyright: >-
  Centrum Educatieve Data Analyse (CEDA) · Onderdeel van <a href="https://npuls.nl/" target="_blank" rel="noopener">Npuls</a> · <a href="https://edu.nl/twt84" target="_blank" rel="noopener">CEDA-community</a> · <a href="mailto:ceda@surf.nl">ceda@surf.nl</a>

plugins:
  - search:
      lang: nl
  # Alleen toevoegen als docs/ een bestand uit de hoofdmap insluit (bijv. README.md):
  # - include-markdown
  # Voeg toe bij Python src/<package>/ API-documentatie:
  # - mkdocstrings:
  #     handlers:
  #       python:
  #         paths: [src]
  #         options:
  #           docstring_style: google
  #           show_source: false
  #           show_root_heading: true
  #           show_symbol_type_heading: true
  #           members_order: source

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - abbr
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.keys
  - pymdownx.superfences
  # Vervang pymdownx.superfences hierboven door onderstaand blok als Mermaid gewenst is:
  # - pymdownx.superfences:
  #     custom_fences:
  #       - name: mermaid
  #         class: mermaid
  #         format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  # Voeg toe als MathJax gewenst is (samen met extra_javascript):
  # - pymdownx.arithmatex:
  #     generic: true
