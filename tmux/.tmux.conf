# ~/.tmux.conf — developer-friendly tmux configuration

# =====================
# General
# =====================

# Start windows and panes at 1 (not 0)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer
set -g history-limit 50000

# Reduce escape-time (critical for Neovim responsiveness)
set -sg escape-time 10

# Enable focus events (used by Neovim and other editors)
set -g focus-events on

# Enable mouse support (click pane, resize, scroll)
set -g mouse on

# =====================
# True Color Support
# =====================

set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"

# =====================
# Prefix Key
# =====================

# Keep default Ctrl-b and also bind Ctrl-a (screen-style)
set -g prefix2 C-a
bind C-a send-prefix -2

# =====================
# Key Bindings
# =====================

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Split panes with intuitive keys (| = horizontal bar, - = vertical bar)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Open new windows in the current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation (prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with prefix + H/J/K/L (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# =====================
# Vi Copy Mode
# =====================

setw -g mode-keys vi

bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# =====================
# Status Bar
# =====================

set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=default,fg=white"

set -g status-left-length 30
set -g status-right-length 60

set -g status-left "#[fg=cyan,bold]#S #[fg=white,nobold]| "
set -g status-right "#[fg=yellow]#(whoami)@#H  #[fg=cyan]%H:%M"

# Active window title style
setw -g window-status-current-style "fg=cyan,bold"
setw -g window-status-current-format " #I:#W#{?window_zoomed_flag, [],} "

# Inactive window title style
setw -g window-status-style "fg=white,dim"
setw -g window-status-format " #I:#W "

# Pane border styles
set -g pane-border-style "fg=white,dim"
set -g pane-active-border-style "fg=cyan"

# =====================
# Activity Monitoring
# =====================

setw -g monitor-activity on
set -g visual-activity off
