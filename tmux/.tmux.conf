# =====================
# Tmux Configuration
# =====================

# Change prefix from C-b to C-a (screen-like, easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Start windows and panes at 1 (not 0)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer
set -g history-limit 50000

# Faster key repetition
set -s escape-time 10

# Use 256-color terminal
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Enable mouse support
set -g mouse on

# =====================
# Key Bindings
# =====================

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Open new windows in current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation (prefix + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with capital HJKL
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# =====================
# Status Bar
# =====================
set -g status-style bg=default
set -g status-position bottom
set -g status-interval 5

set -g status-left-length 30
set -g status-right-length 60

set -g status-left '#[fg=colour2,bold]#S #[default]'
set -g status-right '#[fg=colour3]%H:%M  #[fg=colour6]#(whoami)@#h#[default]'

# Window status format
setw -g window-status-format         '#[fg=colour8] #I:#W '
setw -g window-status-current-format '#[fg=colour6,bold] #I:#W '

# Pane borders
set -g pane-border-style fg=colour8
set -g pane-active-border-style fg=colour6

# =====================
# Copy Mode (Vim bindings)
# =====================
setw -g mode-keys vi

bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# =====================
# Activity Monitoring
# =====================
setw -g monitor-activity on
set -g visual-activity off
